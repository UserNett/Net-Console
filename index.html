<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tennis for Two (1958)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #00ff00;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #gameContainer {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            max-height: 800px;
            position: relative;
            background: #000;
            border: 4px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: crisp-edges;
        }

        .menu, .pauseMenu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .menu h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff00;
            animation: glow 2s ease-in-out infinite;
        }

        .menu h2 {
            font-size: 1.2em;
            margin-bottom: 40px;
            opacity: 0.7;
        }

        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #00ff00; }
            50% { text-shadow: 0 0 20px #00ff00, 0 0 30px #00ff00; }
        }

        button {
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            padding: 15px 40px;
            margin: 10px;
            font-size: 1.2em;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 15px #00ff00;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: none;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 5;
        }

        .controlBtn {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 0.9em;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            font-weight: bold;
        }

        .controlBtn:active {
            background: rgba(0, 255, 0, 0.5);
        }

        .playerControls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .knob {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00ff00, #006600);
            border: 3px solid #00ff00;
            position: relative;
            touch-action: none;
            cursor: grab;
        }

        .knob:active {
            cursor: grabbing;
        }

        .knob::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 28px;
            background: #000;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 3px;
        }

        .keyboardHints {
            position: absolute;
            top: 80px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 60px;
            font-size: 0.9em;
            z-index: 5;
        }

        .keyHint {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            padding: 8px 12px;
            border-radius: 4px;
        }

        .powerBar {
            position: absolute;
            width: 200px;
            height: 40px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            border-radius: 8px;
            display: none;
            flex-direction: row;
            align-items: center;
            padding: 5px;
            z-index: 6;
            top: 20px;
        }

        .powerBar.p1 {
            left: 20px;
        }

        .powerBar.p2 {
            right: 20px;
        }

        .powerFill {
            height: 100%;
            background: linear-gradient(to right, #00ff00, #ffff00, #ff0000);
            border-radius: 4px;
            transition: width 0.1s;
        }

        .powerLabel {
            position: absolute;
            right: 10px;
            font-size: 0.9em;
            white-space: nowrap;
            text-shadow: 0 0 5px #00ff00;
            font-weight: bold;
        }

        .powerControls {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .powerBtn {
            background: rgba(0, 255, 0, 0.2);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-size: 1em;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: manipulation;
            font-weight: bold;
        }

        .powerBtn:active {
            background: rgba(0, 255, 0, 0.5);
        }

        .powerSlider {
            width: 100px;
            height: 25px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            border-radius: 13px;
            position: relative;
            touch-action: none;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .powerSliderFill {
            height: 100%;
            background: linear-gradient(to right, #00ff00, #ffff00, #ff0000);
            border-radius: 11px;
            transition: width 0.05s;
        }

        .powerSliderThumb {
            position: absolute;
            width: 16px;
            height: 16px;
            background: #00ff00;
            border: 2px solid #fff;
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #00ff00;
            transition: left 0.05s;
        }

        .pauseBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            padding: 10px;
            z-index: 5;
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .score {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 2em;
            z-index: 5;
            display: none;
            text-shadow: 0 0 10px #00ff00;
        }

        @media (max-width: 768px) {
            .menu h1 { font-size: 2em; }
            button { padding: 12px 30px; font-size: 1em; }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        
        <div class="score" id="score">0 - 0</div>
        
        <div class="keyboardHints" id="keyboardHints" style="display: none;">
            <div>
                <div class="keyHint">W/S = Angolo | A/D = Potenza | Q = Colpisci</div>
            </div>
            <div>
                <div class="keyHint">↑/↓ = Angolo | ←/→ = Potenza | Spazio = Colpisci</div>
            </div>
        </div>
        
        <div class="powerBar p1" id="powerBar1">
            <div class="powerFill" id="powerFill1"></div>
            <div class="powerLabel" id="powerLabel1">5</div>
        </div>
        
        <div class="powerBar p2" id="powerBar2">
            <div class="powerFill" id="powerFill2"></div>
            <div class="powerLabel" id="powerLabel2">5</div>
        </div>
        
        <button class="pauseBtn" id="pauseBtn">| |</button>
        
        <div class="menu" id="mainMenu">
            <h1>TENNIS FOR TWO</h1>
            <h2>~ Ricreazione 1958 ~</h2>
            <button onclick="startGame('pvp')">GIOCATORE vs GIOCATORE</button>
            <button onclick="startGame('cpu')">GIOCATORE vs CPU</button>
            <button onclick="startGame('showcase')">SHOWCASE (CPU vs CPU)</button>
        </div>

        <div class="menu pauseMenu hidden" id="pauseMenu">
            <h1>PAUSA</h1>
            <button onclick="resumeGame()">RIPRENDI</button>
            <button onclick="backToMenu()">MENU PRINCIPALE</button>
        </div>

        <div class="controls" id="mobileControls">
            <div class="playerControls">
                <div class="knob" id="p1Knob"></div>
                <div class="powerSlider" id="p1Slider">
                    <div class="powerSliderFill" id="p1SliderFill"></div>
                    <div class="powerSliderThumb" id="p1SliderThumb"></div>
                </div>
                <button class="controlBtn" id="p1Hit">COLPISCI</button>
            </div>
            <div class="playerControls">
                <div class="knob" id="p2Knob"></div>
                <div class="powerSlider" id="p2Slider">
                    <div class="powerSliderFill" id="p2SliderFill"></div>
                    <div class="powerSliderThumb" id="p2SliderThumb"></div>
                </div>
                <button class="controlBtn" id="p2Hit">COLPISCI</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const mainMenu = document.getElementById('mainMenu');
        const pauseMenu = document.getElementById('pauseMenu');
        const pauseBtn = document.getElementById('pauseBtn');
        const scoreDisplay = document.getElementById('score');
        const mobileControls = document.getElementById('mobileControls');
        const keyboardHints = document.getElementById('keyboardHints');
        const powerBar1 = document.getElementById('powerBar1');
        const powerBar2 = document.getElementById('powerBar2');
        const powerFill1 = document.getElementById('powerFill1');
        const powerFill2 = document.getElementById('powerFill2');
        const powerLabel1 = document.getElementById('powerLabel1');
        const powerLabel2 = document.getElementById('powerLabel2');

        let gameState = 'menu';
        let gameMode = '';
        let isPaused = false;

        canvas.width = 800;
        canvas.height = 400;

        const game = {
            ball: { x: 400, y: 200, vx: 0, vy: 0, radius: 8, active: false, trail: [], inHand: false, handPlayer: 0, bounces: 0, lastBounceX: 0 },
            p1: { angle: 45, score: 0, lastHit: 0, power: 5, minPower: 3, maxPower: 20 },
            p2: { angle: 45, score: 0, lastHit: 0, power: 5, minPower: 3, maxPower: 20 },
            gravity: 0.3,
            netX: 400,
            courtY: 350,
            groundHeight: 50,
            lastScorer: 0,
            serverPlayer: 1
        };

        const keys = {};
        const isMobile = /Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // Gestione manopole (knobs)
        let knobDragging = { p1: false, p2: false };
        let sliderDragging = { p1: false, p2: false };

        function updatePowerBar(player) {
            const p = player === 1 ? game.p1 : game.p2;
            const fill = player === 1 ? powerFill1 : powerFill2;
            const label = player === 1 ? powerLabel1 : powerLabel2;
            const percentage = ((p.power - p.minPower) / (p.maxPower - p.minPower)) * 100;
            fill.style.width = percentage + '%';
            label.textContent = Math.round(p.power * 10) / 10;
        }

        function updateSlider(player) {
            const p = player === 1 ? game.p1 : game.p2;
            const fill = document.getElementById(player === 1 ? 'p1SliderFill' : 'p2SliderFill');
            const thumb = document.getElementById(player === 1 ? 'p1SliderThumb' : 'p2SliderThumb');
            const percentage = ((p.power - p.minPower) / (p.maxPower - p.minPower)) * 100;
            fill.style.width = percentage + '%';
            thumb.style.left = percentage + '%';
        }

        function initSliders() {
            const sliders = [
                { id: 'p1Slider', player: 1 },
                { id: 'p2Slider', player: 2 }
            ];

            sliders.forEach(({ id, player }) => {
                const slider = document.getElementById(id);
                const p = player === 1 ? game.p1 : game.p2;

                function handleSliderInteraction(e) {
                    const rect = slider.getBoundingClientRect();
                    const touch = e.touches ? e.touches[0] : e;
                    const x = touch.clientX - rect.left;
                    const percentage = Math.max(0, Math.min(100, (x / rect.width) * 100));
                    p.power = p.minPower + (percentage / 100) * (p.maxPower - p.minPower);
                    updateSlider(player);
                    updatePowerBar(player);
                }

                slider.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    sliderDragging[`p${player}`] = true;
                    handleSliderInteraction(e);
                });

                slider.addEventListener('touchmove', (e) => {
                    if (sliderDragging[`p${player}`]) {
                        e.preventDefault();
                        handleSliderInteraction(e);
                    }
                });

                slider.addEventListener('touchend', () => {
                    sliderDragging[`p${player}`] = false;
                });

                slider.addEventListener('mousedown', (e) => {
                    sliderDragging[`p${player}`] = true;
                    handleSliderInteraction(e);
                });

                document.addEventListener('mousemove', (e) => {
                    if (sliderDragging[`p${player}`]) {
                        handleSliderInteraction(e);
                    }
                });

                document.addEventListener('mouseup', () => {
                    sliderDragging[`p${player}`] = false;
                });
            });
        }

        function initKnobs() {
            const p1Knob = document.getElementById('p1Knob');
            const p2Knob = document.getElementById('p2Knob');

            function handleKnobStart(e, player) {
                e.preventDefault();
                knobDragging[player] = true;
            }

            function handleKnobMove(e, knob, player) {
                if (!knobDragging[player]) return;
                
                const rect = knob.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - centerX;
                const dy = touch.clientY - centerY;
                
                // Calcola l'angolo completo (0-360 gradi)
                let angle = Math.atan2(-dy, dx) * 180 / Math.PI;
                angle = ((angle + 90) + 360) % 360;
                
                if (player === 'p1') {
                    game.p1.angle = angle;
                } else {
                    game.p2.angle = angle;
                }
                
                knob.style.transform = `rotate(${-angle}deg)`;
            }

            function handleKnobEnd(player) {
                knobDragging[player] = false;
            }

            p1Knob.addEventListener('touchstart', (e) => handleKnobStart(e, 'p1'));
            p1Knob.addEventListener('mousedown', (e) => handleKnobStart(e, 'p1'));
            
            document.addEventListener('touchmove', (e) => handleKnobMove(e, p1Knob, 'p1'));
            document.addEventListener('mousemove', (e) => handleKnobMove(e, p1Knob, 'p1'));
            
            document.addEventListener('touchend', () => handleKnobEnd('p1'));
            document.addEventListener('mouseup', () => handleKnobEnd('p1'));

            p2Knob.addEventListener('touchstart', (e) => handleKnobStart(e, 'p2'));
            p2Knob.addEventListener('mousedown', (e) => handleKnobStart(e, 'p2'));
            
            document.addEventListener('touchmove', (e) => handleKnobMove(e, p2Knob, 'p2'));
            document.addEventListener('mousemove', (e) => handleKnobMove(e, p2Knob, 'p2'));
            
            document.addEventListener('touchend', () => handleKnobEnd('p2'));
            document.addEventListener('mouseup', () => handleKnobEnd('p2'));
        }

        if (isMobile) {
            mobileControls.style.display = 'flex';
            powerBar1.style.display = 'flex';
            powerBar2.style.display = 'flex';
            initKnobs();
            initSliders();
            updateSlider(1);
            updateSlider(2);
            updatePowerBar(1);
            updatePowerBar(2);
        } else {
            keyboardHints.style.display = 'flex';
        }

        document.getElementById('p1Hit').addEventListener('touchstart', (e) => {
            e.preventDefault();
            hitBall(1);
        });
        
        document.getElementById('p1Hit').addEventListener('click', () => {
            hitBall(1);
        });
        
        document.getElementById('p2Hit').addEventListener('touchstart', (e) => {
            e.preventDefault();
            hitBall(2);
        });
        
        document.getElementById('p2Hit').addEventListener('click', () => {
            hitBall(2);
        });

        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (gameState === 'playing' && !isPaused && gameMode !== 'showcase') {
                // Giocatore 1 - controlli angolo e potenza
                if (e.key === 'w') game.p1.angle = (game.p1.angle + 5) % 360;
                if (e.key === 's') game.p1.angle = (game.p1.angle - 5 + 360) % 360;
                if (e.key === 'a') {
                    game.p1.power = Math.max(game.p1.power - 0.5, game.p1.minPower);
                    updatePowerBar(1);
                }
                if (e.key === 'd') {
                    game.p1.power = Math.min(game.p1.power + 0.5, game.p1.maxPower);
                    updatePowerBar(1);
                }
                if (e.key === 'q') hitBall(1);
                
                if (gameMode === 'pvp') {
                    // Giocatore 2 - controlli angolo e potenza
                    if (e.key === 'ArrowUp') game.p2.angle = (game.p2.angle + 5) % 360;
                    if (e.key === 'ArrowDown') game.p2.angle = (game.p2.angle - 5 + 360) % 360;
                    if (e.key === 'ArrowLeft') {
                        game.p2.power = Math.max(game.p2.power - 0.5, game.p2.minPower);
                        updatePowerBar(2);
                    }
                    if (e.key === 'ArrowRight') {
                        game.p2.power = Math.min(game.p2.power + 0.5, game.p2.maxPower);
                        updatePowerBar(2);
                    }
                    if (e.key === ' ') {
                        e.preventDefault();
                        hitBall(2);
                    }
                }
            }
            
            if (e.key === 'Escape' && gameState === 'playing') {
                togglePause();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        pauseBtn.addEventListener('click', togglePause);

        function startGame(mode) {
            gameMode = mode;
            gameState = 'playing';
            mainMenu.classList.add('hidden');
            pauseBtn.style.display = 'block';
            scoreDisplay.style.display = 'block';
            game.p1.score = 0;
            game.p2.score = 0;
            game.p1.power = 5;
            game.p2.power = 5;
            game.serverPlayer = 1;
            updateScore();
            updatePowerBar(1);
            updatePowerBar(2);
            
            // Mostra controlli solo se non è showcase
            if (mode === 'showcase') {
                mobileControls.style.display = 'none';
                keyboardHints.style.display = 'none';
            } else if (!isMobile) {
                powerBar1.style.display = 'flex';
                powerBar2.style.display = 'flex';
            }
            
            resetBall();
            gameLoop();
        }

        function togglePause() {
            isPaused = !isPaused;
            pauseMenu.classList.toggle('hidden');
        }

        function resumeGame() {
            isPaused = false;
            pauseMenu.classList.add('hidden');
        }

        function backToMenu() {
            gameState = 'menu';
            isPaused = false;
            mainMenu.classList.remove('hidden');
            pauseMenu.classList.add('hidden');
            pauseBtn.style.display = 'none';
            scoreDisplay.style.display = 'none';
            powerBar1.style.display = 'none';
            powerBar2.style.display = 'none';
        }

        function resetBall() {
            if (game.serverPlayer === 1) {
                game.ball.x = 50;
                game.ball.y = game.courtY - 20;
                game.ball.vx = 0;
                game.ball.vy = 0;
                game.ball.inHand = true;
                game.ball.handPlayer = 1;
            } else {
                game.ball.x = 750;
                game.ball.y = game.courtY - 20;
                game.ball.vx = 0;
                game.ball.vy = 0;
                game.ball.inHand = true;
                game.ball.handPlayer = 2;
            }
            
            game.ball.active = true;
            game.ball.trail = [];
            game.ball.bounces = 0;
            game.ball.lastBounceX = 0;
            game.p1.angle = 45;
            game.p2.angle = 45;
        }

        function hitBall(player) {
            const now = Date.now();
            const p = player === 1 ? game.p1 : game.p2;
            
            if (now - p.lastHit < 200) return;
            p.lastHit = now;

            const ballX = game.ball.x;
            const ballY = game.ball.y;
            const playerX = player === 1 ? 50 : 750;
            
            const dist = Math.sqrt(Math.pow(ballX - playerX, 2) + Math.pow(ballY - game.courtY, 2));
            
            // Se la palla è in mano del giocatore, la lancia
            if (game.ball.inHand && game.ball.handPlayer === player) {
                const angle = p.angle * Math.PI / 180;
                const speed = p.power;
                
                game.ball.vx = (player === 1 ? 1 : -1) * speed * Math.cos(angle);
                game.ball.vy = -speed * Math.sin(angle);
                game.ball.inHand = false;
                game.ball.handPlayer = 0;
                game.ball.bounces = 0;
                
                playHitSound();
            }
            // Altrimenti se la palla è vicina, la colpisce
            else if (dist < 80 && game.ball.active && !game.ball.inHand) {
                const angle = p.angle * Math.PI / 180;
                const speed = p.power;
                
                game.ball.vx = (player === 1 ? 1 : -1) * speed * Math.cos(angle);
                game.ball.vy = -speed * Math.sin(angle);
                game.ball.bounces = 0;
                
                playHitSound();
            }
        }

        function cpuAI() {
            if ((gameMode !== 'cpu' && gameMode !== 'showcase') || !game.ball.active) return;
            
            // CPU Giocatore 2 (sempre attiva in cpu e showcase)
            if (game.ball.inHand && game.ball.handPlayer === 2) {
                setTimeout(() => {
                    if (game.ball.inHand && game.ball.handPlayer === 2) {
                        const targetAngle = 30 + Math.random() * 120;
                        game.p2.angle = targetAngle;
                        game.p2.power = 8 + Math.random() * 8;
                        updatePowerBar(2);
                        hitBall(2);
                    }
                }, 300 + Math.random() * 400);
                return;
            }
            
            if (game.ball.x > game.netX && game.ball.vx > 0 && !game.ball.inHand) {
                const ballDist = game.ball.x - 750;
                const targetAngle = 30 + Math.random() * 120;
                
                if (Math.abs(game.p2.angle - targetAngle) > 3) {
                    game.p2.angle += (targetAngle > game.p2.angle ? 3 : -3);
                }
                
                const dist = Math.sqrt(Math.pow(game.ball.x - 750, 2) + Math.pow(game.ball.y - game.courtY, 2));
                if (dist < 120 && Math.random() > 0.2) {
                    game.p2.power = 8 + Math.random() * 8;
                    updatePowerBar(2);
                    hitBall(2);
                }
            }
            
            // CPU Giocatore 1 (solo in modalità showcase)
            if (gameMode === 'showcase') {
                if (game.ball.inHand && game.ball.handPlayer === 1) {
                    setTimeout(() => {
                        if (game.ball.inHand && game.ball.handPlayer === 1) {
                            const targetAngle = 30 + Math.random() * 120;
                            game.p1.angle = targetAngle;
                            game.p1.power = 8 + Math.random() * 8;
                            updatePowerBar(1);
                            hitBall(1);
                        }
                    }, 300 + Math.random() * 400);
                    return;
                }
                
                if (game.ball.x < game.netX && game.ball.vx < 0 && !game.ball.inHand) {
                    const targetAngle = 30 + Math.random() * 120;
                    
                    if (Math.abs(game.p1.angle - targetAngle) > 3) {
                        game.p1.angle += (targetAngle > game.p1.angle ? 3 : -3);
                    }
                    
                    const dist = Math.sqrt(Math.pow(game.ball.x - 50, 2) + Math.pow(game.ball.y - game.courtY, 2));
                    if (dist < 120 && Math.random() > 0.2) {
                        game.p1.power = 8 + Math.random() * 8;
                        updatePowerBar(1);
                        hitBall(1);
                    }
                }
            }
        }

        function updateScore() {
            scoreDisplay.textContent = `${game.p1.score} - ${game.p2.score}`;
        }

        function playHitSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.frequency.value = 200;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.1);
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#00ff00';
            ctx.fillStyle = '#00ff00';
            ctx.lineWidth = 2;
            
            // Campo da tennis (vista laterale)
            ctx.beginPath();
            ctx.moveTo(0, game.courtY);
            ctx.lineTo(canvas.width, game.courtY);
            ctx.stroke();
            
            // Rete
            ctx.beginPath();
            ctx.moveTo(game.netX, game.courtY);
            ctx.lineTo(game.netX, game.courtY - 60);
            ctx.stroke();
            
            // Giocatore 1 (sinistra)
            ctx.beginPath();
            ctx.arc(50, game.courtY, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Linea angolo giocatore 1
            const dist1 = Math.sqrt(Math.pow(game.ball.x - 50, 2) + Math.pow(game.ball.y - game.courtY, 2));
            if ((dist1 < 100 && game.ball.active) || (game.ball.inHand && game.ball.handPlayer === 1)) {
                const angle1 = game.p1.angle * Math.PI / 180;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(50, game.courtY);
                ctx.lineTo(50 + Math.cos(angle1) * 60, game.courtY - Math.sin(angle1) * 60);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // Giocatore 2 (destra)
            ctx.beginPath();
            ctx.arc(750, game.courtY, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Linea angolo giocatore 2
            const dist2 = Math.sqrt(Math.pow(game.ball.x - 750, 2) + Math.pow(game.ball.y - game.courtY, 2));
            if ((dist2 < 100 && game.ball.active) || (game.ball.inHand && game.ball.handPlayer === 2)) {
                const angle2 = game.p2.angle * Math.PI / 180;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(750, game.courtY);
                ctx.lineTo(750 - Math.cos(angle2) * 60, game.courtY - Math.sin(angle2) * 60);
                ctx.stroke();
                ctx.setLineDash([]);
            }
            
            // Scia della palla
            ctx.globalAlpha = 0.3;
            for (let i = 0; i < game.ball.trail.length; i++) {
                const t = game.ball.trail[i];
                const alpha = i / game.ball.trail.length * 0.5;
                ctx.globalAlpha = alpha;
                ctx.beginPath();
                ctx.arc(t.x, t.y, game.ball.radius - 1, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // Palla
            if (game.ball.active) {
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ff00';
                ctx.beginPath();
                ctx.arc(game.ball.x, game.ball.y, game.ball.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function update() {
            if (isPaused || !game.ball.active) return;
            
            // Se la palla è in mano di un giocatore, rimane ferma nella sua posizione
            if (game.ball.inHand) {
                if (game.ball.handPlayer === 1) {
                    game.ball.x = 50;
                    game.ball.y = game.courtY - 20;
                } else if (game.ball.handPlayer === 2) {
                    game.ball.x = 750;
                    game.ball.y = game.courtY - 20;
                }
                game.ball.vx = 0;
                game.ball.vy = 0;
                game.ball.trail = [];
                return;
            }
            
            game.ball.vy += game.gravity;
            game.ball.x += game.ball.vx;
            game.ball.y += game.ball.vy;
            
            game.ball.trail.push({ x: game.ball.x, y: game.ball.y });
            if (game.ball.trail.length > 10) game.ball.trail.shift();
            
            // Controllo rimbalzo sul terreno
            if (game.ball.y >= game.courtY) {
                game.ball.y = game.courtY;
                game.ball.vy *= -0.7;
                game.ball.vx *= 0.95;
                
                // Conta i rimbalzi
                game.ball.bounces++;
                
                // Se la palla rimbalza 2 volte nello stesso campo, punto all'avversario
                if (game.ball.bounces >= 2) {
                    if (game.ball.x < game.netX) {
                        // 2 rimbalzi a sinistra = punto al giocatore 2
                        game.p2.score++;
                        game.serverPlayer = 2;
                    } else {
                        // 2 rimbalzi a destra = punto al giocatore 1
                        game.p1.score++;
                        game.serverPlayer = 1;
                    }
                    updateScore();
                    setTimeout(resetBall, 1000);
                    game.ball.active = false;
                }
                
                if (Math.abs(game.ball.vy) < 0.5 && game.ball.bounces < 2) {
                    // Punto segnato per palla ferma
                    if (game.ball.x < game.netX) {
                        game.p2.score++;
                        game.serverPlayer = 2;
                    } else {
                        game.p1.score++;
                        game.serverPlayer = 1;
                    }
                    updateScore();
                    setTimeout(resetBall, 1000);
                    game.ball.active = false;
                }
            }
            
            // Controllo rete
            if (Math.abs(game.ball.x - game.netX) < 5 && game.ball.y > game.courtY - 60) {
                game.ball.vx *= -0.5;
            }
            
            // Controllo bordi
            if (game.ball.x < 0 || game.ball.x > canvas.width) {
                if (game.ball.x < game.netX) {
                    game.p2.score++;
                    game.serverPlayer = 2;
                } else {
                    game.p1.score++;
                    game.serverPlayer = 1;
                }
                updateScore();
                setTimeout(resetBall, 1000);
                game.ball.active = false;
            }
            
            cpuAI();
        }

        function gameLoop() {
            if (gameState !== 'playing') return;
            
            if (!isPaused) {
                update();
            }
            draw();
            
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
